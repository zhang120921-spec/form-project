  <div id="root"></div>
  <div id="boot-status">FORM</div>
  <div id="boot-error"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      var el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = (err && err.stack) ? err.stack : (msg + ' at ' + url + ':' + line + ':' + col);
      var s = document.getElementById('boot-status');
      if(s) s.remove();
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = 'Unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    });
    // Hide boot status when React renders
    var observer = new MutationObserver(function() {
      var root = document.getElementById('root');
      if(root && root.children.length > 0) {
        var s = document.getElementById('boot-status');
        if(s) s.style.display = 'none';
      }
    });
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>
</body>
</html>
